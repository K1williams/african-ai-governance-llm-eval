name: Exploratory open-model evaluation (12 paired questions)
on:
  push:
    paths:
      - 'pilot/items.json'
      - 'pilot/offline_eval.py'
      - 'pilot/test_offline_eval.py'
      - '.github/workflows/experimental-open-model-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exploratory-pilot
  cancel-in-progress: false
jobs:
  run-small-model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pilot unit tests
        run: |
          python -m unittest discover -s pilot -v
          python -m pilot.offline_eval --dry-run
      - name: Install public-model CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.46.3' 'huggingface_hub>=0.26,<1' 'tokenizers>=0.20,<0.21'
      - name: Run actual model inference
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python -m pilot.offline_eval --model Qwen/Qwen2.5-0.5B-Instruct --max-items 12 --max-new-tokens 128
      - name: Upload raw observations even if later publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-open-model-pilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            pilot/observations.jsonl
            pilot/OBSERVED_RESPONSES.md
      - name: Commit observational data only after successful inference
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pilot/observations.jsonl pilot/OBSERVED_RESPONSES.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual open-weight inference observations (not accuracy claims)'
            git push origin HEAD:main
          fi

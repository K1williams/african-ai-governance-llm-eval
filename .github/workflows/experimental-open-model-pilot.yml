name: Exploratory open-model evaluation (12 paired questions)
on:
  push:
    paths:
      - pilot/items.json
      - pilot/offline_eval.py
      - pilot/test_offline_eval.py
      - .github/workflows/experimental-open-model-pilot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-small-model:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-model CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers==4.46.3' 'huggingface_hub>=0.26,<1' 'tokenizers>=0.20,<0.21'
      - name: Run study pilot on open weights
        run: python -m pilot.offline_eval --model Qwen/Qwen2.5-0.5B-Instruct --max-items 12 --max-new-tokens 128
      - name: Upload complete raw responses as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: experimental-open-model-pilot
          path: |
            pilot/observations.jsonl
            pilot/OBSERVED_RESPONSES.md
      - name: Commit observational data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pilot/observations.jsonl pilot/OBSERVED_RESPONSES.md
          git commit -m 'Record open-weight pilot inference observations (no accuracy claims)' || exit 0
          git push origin HEAD:main